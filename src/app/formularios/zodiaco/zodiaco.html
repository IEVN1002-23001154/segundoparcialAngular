<div>
    <h1>Datos personales</h1>    
    <label>Nombre</label>
    <input [(ngModel)]="nombre" type="text" name="" id="" placeholder="escribe el nombre">
    <br>
    <label>Apaterno</label>
    <input [(ngModel)]="apaterno" type="text" name="" id="" placeholder="escribe el apaterno">
    <br>
    <label>Amaterno</label>
    <input [(ngModel)]="amaterno" type="text" name="" id="" placeholder="escribe el amaterno">
    <br>
    <h1>Fecha de nacimiento</h1>
    <label>Dia</label> 
    <input [(ngModel)]="dia" type="text" name="" id="">
    <label>Mes</label>
    <input [(ngModel)]="mes" type="text" name="" id="">
    <label>Año</label>
    <input [(ngModel)]="anio" type="text" name="" id="">
    <h1>Sexo</h1>
    <input [(ngModel)]="sexo" type="radio" name="" id="" value="Masculino">Masculino
    <input [(ngModel)]="sexo" type="radio" name="" id="" value="Femenino">Femenino

    <button (click)="imprimir()" type="button" class="btn btn-primary">Calcular</button>

    <hr>
    
    <div>
        <h1>Hola {{ nombre }} {{ apaterno }} {{ amaterno }}</h1>

        <h1>Tienes {{ edadcalculada }} años</h1>

        <h1>Es {{ signo }}</h1>

        <img [src]="img" alt="Signo Zodiacal">
        
    </div>
</div>

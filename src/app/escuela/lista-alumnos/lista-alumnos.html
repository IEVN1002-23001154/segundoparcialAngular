<div class="max-w-3xl mx-auto mt-8 p-4">
  <h2 class="text-2xl font-bold text-gray-600 mb-6">Lista Alumnos</h2>

  <form>
    <!-- Campo Matricula -->
    <div class="mb-6">
      <label
        for="matricula"
        class="block mb-2 text-sm font-medium text-gray-700"
        >Matricula</label
      >
      <input
        type="text"
        id="matricula"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Matricula"
        required
      />
    </div>

    <!-- Campo Nombre -->
    <div class="mb-6">
      <label for="nombre" class="block mb-2 text-sm font-medium text-gray-700"
        >Nombre</label
      >
      <input
        type="text"
        id="nombre"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Nombre"
        required
      />
    </div>

    <!-- Campo Correo -->
    <div class="mb-6">
      <label for="correo" class="block mb-2 text-sm font-medium text-gray-700"
        >Correo</label
      >
      <input
        type="email"
        id="correo"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Correo"
        required
      />
    </div>

    <!-- Campo Materia -->
    <div class="mb-6">
      <label for="materia" class="block mb-2 text-sm font-medium text-gray-700"
        >Materia</label
      >
      <input
        type="text"
        id="materia"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Materia"
        required
      />
    </div>
  </form>
</div>

<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow">
  <h2 class="text-2xl font-bold text-gray-600 mb-6">Lista Alumnos</h2>

  <form [formGroup]="formulario">
    <!-- Campo Matricula -->
    <div class="mb-6">
      <label
        for="matricula"
        class="block mb-2 text-sm font-medium text-gray-700"
        >Matricula</label
      >
      <input
        type="text"
        id="matricula"
        formControlName="matricula"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Matricula"
        required
      />
    </div>

    <!-- Campo Nombre -->
    <div class="mb-6">
      <label for="nombre" class="block mb-2 text-sm font-medium text-gray-700"
        >Nombre</label
      >
      <input
        type="text"
        id="nombre"
        formControlName="nombre"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Nombre"
        required
      />
    </div>

    <!-- Campo Correo -->
    <div class="mb-6">
      <label for="correo" class="block mb-2 text-sm font-medium text-gray-700"
        >Correo</label
      >
      <input
        type="email"
        id="correo"
        formControlName="correo"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Correo"
        required
      />
    </div>

    <!-- Campo Materia -->
    <div class="mb-6">
      <label for="materia" class="block mb-2 text-sm font-medium text-gray-700"
        >Materia</label
      >
      <input
        type="text"
        id="materia"
        formControlName="materia"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Materia"
        required
      />
    </div>

    <!-- Botón -->
    <div class="flex justify-center mt-5">
      <button
        type="submit"
        (click)="muestraAlumnos()"
        class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Registrar
      </button>
    </div>
  </form>

  <br />

  <!-- Impresión de Datos -->
  <h1>Lista Alumno</h1>
  <h2>Matricula: {{nuevoAlumno.matricula}}</h2>
  <h2>Nombre: {{nuevoAlumno.nombre}}</h2>
  <h2>Correo: {{nuevoAlumno.correo}}</h2>
  <h2>Materia: {{nuevoAlumno.materia}}</h2>

  <!-- Tabla -->
  <div class="max-w-6xl mx-auto mt-8"></div>
</div>

<div
  class="p-6 bg-cover bg-center"
  style="background-image: url(&quot;imagenes/cinepolis.png&quot;)"
>
  <div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow opacity-95">
    <h2 class="text-2xl font-bold text-gray-600 mb-6">Cinépolis</h2>

    <form [formGroup]="formulario">
      <!-- Campo Nombre -->
      <div class="mb-6">
        <label for="nombre" class="block mb-2 text-sm font-medium text-gray-700"
          >Nombre</label
        >
        <input
          type="text"
          id="nombre"
          formControlName="nombre"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
          placeholder="Nombre"
        />
      </div>

      <!-- Campo Compradores -->
      <div class="mb-6">
        <label
          for="compradores"
          class="block mb-2 text-sm font-medium text-gray-700"
          >Cantidad Compradores</label
        >
        <input
          type="number"
          id="compradores"
          formControlName="compradores"
          min="1"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        />
      </div>

      <!-- Campo Tarjeta Cineco -->
      <div class="mb-6">
        <label class="block mb-2 text-sm font-medium text-gray-700"
          >Tarjeta Cineco</label
        >
        <div class="flex gap-4">
          <label
            ><input type="radio" formControlName="tarjetaCineco" value="si" />
            Sí</label
          >
          <label
            ><input type="radio" formControlName="tarjetaCineco" value="no" />
            No</label
          >
        </div>
      </div>

      <!-- Campo Boletas -->
      <div class="mb-6">
        <label
          for="boletas"
          class="block mb-2 text-sm font-medium text-gray-700"
          >Cantidad de Boletas</label
        >
        <input
          type="number"
          id="boletas"
          formControlName="boletas"
          min="1"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        />
      </div>

      <!-- Valor a Pagar -->
      <div class="mb-6">
        <label class="block mb-2 text-sm font-medium text-gray-700"
          >Valor a Pagar $</label
        >
        <input
          type="text"
          [value]="valorPagar"
          disabled
          class="bg-gray-100 border border-gray-300 text-gray-900 font-bold text-sm rounded-lg block w-full p-2.5"
        />
      </div>

      <!-- Mensaje de Error -->
      <div
        *ngIf="mensajeError"
        class="mb-6 p-4 text-sm text-red-800 rounded-lg bg-red-100"
      >
        {{ mensajeError }}
      </div>

      <!-- Botones -->
      <div class="flex justify-center gap-4 mt-5">
        <button
          type="submit"
          (click)="procesar()"
          class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5"
        >
          Procesar
        </button>
        <button
          type="button"
          (click)="verRegistros()"
          class="text-gray-900 bg-yellow-400 hover:bg-yellow-500 focus:ring-4 focus:outline-none focus:ring-yellow-300 font-medium rounded-lg text-sm px-5 py-2.5"
        >
          Ver Registros
        </button>
      </div>
    </form>
  </div>
</div>

<div class="max-w-6xl mx-auto p-6 bg-white rounded-lg shadow mt-8">
  <h2 class="mb-4 text-2xl font-bold text-gray-900">Registros de Ventas Cinépolis</h2>
  
  <button (click)="volver()" class="text-white bg-gray-600 hover:bg-gray-700 focus:ring-4 focus:outline-none focus:ring-gray-300 font-medium rounded-lg text-sm px-5 py-2.5 mb-6">
    Regresar a Ventas
  </button>

  <div class="relative overflow-x-auto shadow-md sm:rounded-lg">
    <table class="w-full text-sm text-left text-gray-500">
      <thead class="text-xs text-gray-700 uppercase bg-gray-100">
        <tr>
          <th scope="col" class="px-6 py-3">Nombre</th>
          <th scope="col" class="px-6 py-3">Compradores</th>
          <th scope="col" class="px-6 py-3">Boletas</th>
          <th scope="col" class="px-6 py-3">Tarjeta Cineco</th>
          <th scope="col" class="px-6 py-3">Total Pagado</th>
          <th scope="col" class="px-6 py-3">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let venta of ventas; let i = index" class="bg-white border-b border-gray-200 hover:bg-gray-50">
          <td class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap">{{ venta.nombre }}</td>
          <td class="px-6 py-4">{{ venta.compradores }}</td>
          <td class="px-6 py-4">{{ venta.boletas }}</td>
          <td class="px-6 py-4">{{ venta.tarjetaCineco }}</td>
          <td class="px-6 py-4">${{ venta.total }}</td>
          <td class="px-6 py-4">
            <div class="flex gap-2">
              <button type="button" class="px-4 py-2 text-sm font-medium text-white bg-green-600 rounded-lg hover:bg-green-700 focus:ring-4 focus:outline-none focus:ring-green-300" (click)="editarVenta(i)">
                Editar
              </button>
              <button type="button" class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 focus:ring-4 focus:outline-none focus:ring-red-300" (click)="eliminarVenta(i)">
                Eliminar
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="ventas.length === 0" class="p-4 mt-4 text-sm text-gray-800 rounded-lg bg-gray-100" role="alert">
    <span class="font-medium">Información:</span> No hay ventas registradas.
  </div>

  <!-- Formulario de edición (idéntico al de agregar alumno) -->
  <div *ngIf="indiceEdicion !== -1" class="mt-8">
    <h2 class="text-2xl font-bold text-gray-600 mb-6">Editar Registro</h2>
    
    <form [formGroup]="formulario">
      <div class="mb-6">
        <label class="block mb-2 text-sm font-medium text-gray-700">Nombre</label>
        <input type="text" formControlName="nombre" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" />
      </div>
      
      <div class="mb-6">
        <label class="block mb-2 text-sm font-medium text-gray-700">Cantidad Compradores</label>
        <input type="number" formControlName="compradores" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" />
      </div>

      <div class="mb-6">
        <label class="block mb-2 text-sm font-medium text-gray-700">Tarjeta Cineco</label>
        <div class="flex gap-4">
          <label><input type="radio" formControlName="tarjetaCineco" value="si" /> Sí</label>
          <label><input type="radio" formControlName="tarjetaCineco" value="no" /> No</label>
        </div>
      </div>

      <div class="mb-6">
        <label class="block mb-2 text-sm font-medium text-gray-700">Cantidad De Boletas</label>
        <input type="number" formControlName="boletas" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" />
      </div>

      <div *ngIf="mensajeError" class="mb-6 p-4 text-sm text-red-800 rounded-lg bg-red-50">
        {{ mensajeError }}
      </div>

      <div class="flex justify-center gap-4 mt-5">
        <button type="button" (click)="guardarEdicion()" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5">
          Guardar Cambios
        </button>
        <button type="button" (click)="limpiarCampos()" class="text-white bg-gray-500 hover:bg-gray-600 focus:ring-4 focus:outline-none focus:ring-gray-300 font-medium rounded-lg text-sm px-5 py-2.5">
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
